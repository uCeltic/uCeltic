# Production overlay for a self-managed VPS (issue #9, #38). Layer it on the base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# It pulls the blessed registry images (no on-box build) and adds prod concerns
# (HTTPS port, restart policy, prod Caddyfile, persisted CA).
services:
  db:
    restart: unless-stopped

  backend:
    # Blessed image from CI (:prod = latest build that passed the smoke gate).
    image: ghcr.io/uceltic/uceltic/backend:prod
    restart: unless-stopped

  web:
    # Service is `web`, image is `client`.
    image: ghcr.io/uceltic/uceltic/client:prod
    restart: unless-stopped
    # Caddy needs SERVER_IP at runtime; the base web service has no env_file.
    env_file: .env
    ports:
      # 80 is already published by the base file (Caddy uses it for the HTTP->HTTPS redirect).
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Persist the internal CA + cert so reboots/rebuilds don't regenerate them.
      - caddydata:/data

volumes:
    caddydata: