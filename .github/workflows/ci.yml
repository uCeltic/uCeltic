name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: uceltic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_PASSWORD: postgres
      SECRET_KEY: ci-not-a-secret   # throwaway: lets makemigrations import settings under DEBUG=False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Test with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=70

  frontend:
    name: Frontend (Vite + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check + build
        run: npm run build
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (vitest)
        run: npm test

  release:
    name: Build, smoke, and bless :prod
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SHA_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercased GHCR prefix
        # ${{ github.repository }} is uCeltic/uCeltic; GHCR rejects uppercase, so
        # lowercase it before any build/push or the very first run fails with
        # "repository name must be lowercase".
        run: echo "IMAGE_PREFIX=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/client:${{ env.SHA_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the assembled stack from the pushed :sha images
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_PREFIX }}/backend:${{ env.SHA_TAG }}
          CLIENT_IMAGE: ${{ env.IMAGE_PREFIX }}/client:${{ env.SHA_TAG }}
        run: |
          cp .env.ci .env
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --pull always
          ./scripts/smoke.sh http://localhost:80
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

      - name: Bless :prod (only reached if smoke passed)
        run: |
          for img in backend client; do
            docker buildx imagetools create \
              --tag "${IMAGE_PREFIX}/${img}:prod" \
              "${IMAGE_PREFIX}/${img}:${SHA_TAG}"
          done

  smoke-script:
    name: Smoke + env contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scripts/ unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
